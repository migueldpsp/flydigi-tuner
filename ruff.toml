target-version = "py310"
line-length = 120

[lint]
select = ["E", "F", "W", "B", "UP", "SIM", "PL"]
ignore = [
    "E402",     # scripts put sys.path setup before imports on purpose
    "PLC0415",  # some imports are local to keep startup fast or avoid cycles
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # validation code is long and full of limits
    "PLW0603",  # test counters
    "SIM108",
    "B023",
]
